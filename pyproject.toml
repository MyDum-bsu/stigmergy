[project]
name = "stigmergy"
version = "0.1.0"
description = "Tool-agnostic dark-factory contour: event log, episodes, gates, merge queue"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
stg = "stigmergy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stigmergy"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/stigmergy/dash.py" = ["E501"]
